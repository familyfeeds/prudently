<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Prudently</title>
<meta name="robots" content="noindex">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap');
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
  }
  #dots {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 34px;
    pointer-events: none;
  }
  .panel {
    width: min(360px, calc(100vw - 72px));
    height: min(565px, calc(100dvh - 68px));
    min-height: 350px;
    border-radius: 32px;
    background: linear-gradient(180deg, #fcfcfc 0%, #f6f6f6 100%);
    border: 1px solid rgba(0, 0, 0, 0.05);
    box-shadow:
      0 20px 45px rgba(0, 0, 0, 0.045),
      0 2px 10px rgba(0, 0, 0, 0.025),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 28px 26px;
    color: #111111;
    pointer-events: auto;
    overflow-y: auto;
  }
  .panel-title {
    width: 100%;
    text-align: center;
    margin-top: 4px;
    font-family: "Comic Sans MS", "Marker Felt", "Trebuchet MS", cursive, sans-serif;
    font-size: clamp(34px, 5.2vw, 42px);
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: 0.2px;
    color: #111111;
  }
  .title-underline {
    width: 124px;
    height: 17px;
    margin: 10px auto 22px;
    overflow: visible;
  }
  .username-field, .password-field {
    width: 100%;
    max-width: 272px;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .username-field label, .password-field label {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: "Comic Sans MS", "Marker Felt", "Trebuchet MS", cursive, sans-serif;
    color: #111;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: .1px;
  }
  .person-icon, .lock-icon { width: 21px; height: 21px; flex: none; }
  .username-field input, .password-field input {
    display: block;
    width: 100%;
    height: 50px;
    padding: 0 16px;
    border: 1.5px solid #d5d5d5;
    background: #fff;
    border-radius: 15px;
    outline: none;
    color: #111;
    font: 500 16px Arial, Helvetica, sans-serif;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .username-field input:focus, .password-field input:focus {
    border-color: #191919;
    box-shadow: 0 0 0 3px rgba(0,0,0,.07);
  }
  .username-field input::placeholder, .password-field input::placeholder { color: #939393; }
  .password-field { margin-top: 19px; }
  .panel { padding-bottom: 20px; }
  .password-field { gap: 9px; }
  .show-password-row { display:flex; align-items:center; gap:8px; margin: 0; color:#333; font: 600 13px/1.3 "Trebuchet MS",Arial,sans-serif; cursor:pointer; }
  .show-password-row input { appearance:auto; width:16px; height:16px; margin:0; accent-color:#24a961; cursor:pointer; }

  .generate-password {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    background: #ffad40;
    color: #17120a;
    border: 1px solid #f4a037;
    border-radius: 999px;
    padding: 10px 15px 10px 12px;
    min-height: 40px;
    font: 700 13px/1.15 "Trebuchet MS", Arial, sans-serif;
    cursor: pointer;
    box-shadow: 0 4px 0 #e7952d, 0 7px 14px rgba(216,137,34,.13);
    transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .generate-password svg { flex: none; }
  .generate-password:hover { background: #ffbf66; transform: translateY(-1px); }
  .generate-password:active { transform: translateY(3px); box-shadow: 0 1px 0 #e7952d; }

  .primary-action {
    width: 100%; max-width: 272px; min-height: 46px;
    margin-top: auto; border: 1px solid #14884c;
    border-radius: 14px; background: #25b66b; color: #fff;
    font: 700 17px/1.2 "Trebuchet MS", Arial, sans-serif;
    cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 10px;
    box-shadow: 0 4px 0 #138b4e, 0 7px 14px rgba(22,135,77,.12);
    transition: background .15s ease, transform .15s ease;
  }
  .primary-action:hover { background: #2dc676; transform: translateY(-1px); }
  .primary-action:active { transform: translateY(2px); }
  .primary-action svg { width: 19px; height: 19px; }
  .auth-switch { margin: 18px 0 1px; border: 0; padding: 2px 6px;
    background: transparent; color: #52a7db; font: 700 13px/1.25 "Trebuchet MS",Arial,sans-serif;
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .auth-switch:hover { color: #247aa9; }
  .primary-action:focus-visible, .auth-switch:focus-visible, .generate-password:focus-visible {
    outline: 3px solid #161616; outline-offset: 3px; }
  .notice { font: 700 12px/1.4 Arial,sans-serif; color: #c32222; text-align: center;
    max-width: 272px; min-height: 17px; margin: 8px 0; }
  .save-overlay { position: fixed; inset: 0; z-index: 20; display: none; align-items: center;
    justify-content: center; padding: 20px; background: rgba(0,0,0,.38); }
  .save-overlay.visible { display: flex; }
  .save-dialog { background: #fff; border-radius: 24px; padding: 30px 24px;
    width: min(405px,100%); box-shadow: 0 22px 70px rgba(0,0,0,.20);
    text-align:center; border:1px solid #ededed; }
  .save-dialog h2 { font-family: "Trebuchet MS", Arial, sans-serif;
    font-size: 25px; line-height:1.2; color:#111; margin: 0 0 12px; }
  .save-dialog p { color:#4c4c4c; font-size: 15px; line-height:1.5;
    margin: 0 0 22px; }
  .save-actions { display:flex; flex-direction:column; gap:13px; }
  .save-action { width:100%; min-height:62px; border:0; border-radius:15px;
    display:flex; align-items:center; justify-content:center; gap:12px;
    font:700 17px/1.25 "Trebuchet MS",Arial,sans-serif;
    color:#fff; cursor:pointer; padding:13px 15px;
    transition:transform .15s,filter .15s; }
  .save-action:hover { transform:translateY(-2px); filter:brightness(1.05); }
  .save-action:focus-visible { outline:3px solid #111; outline-offset:3px; }
  .save-action svg { width:24px; height:24px; flex:none; }
  .remember-action { background:#1eaa5b; box-shadow:0 4px 0 #14753e; }
  .just-create-action { background:#df4545; box-shadow:0 4px 0 #a82f2f; }
  .save-note { font:13px/1.45 Arial,sans-serif; color:#656565;
    margin:18px 0 0 !important; }
  .blank-page { display: none; position: fixed; inset: 0; background: #fff; z-index: 10; }
  .home-heading {
    position: absolute;
    top: clamp(34px, 6.8vh, 78px);
    left: clamp(28px, 6vw, 92px);
    width: max-content;
  }
  .home-heading h1 {
    margin: 0;
    font-family: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    font-weight: 800;
    font-size: clamp(72px, 8vw, 112px);
    line-height: 1;
    letter-spacing: -0.045em;
    color: #101010;
    text-rendering: geometricPrecision;
    -webkit-font-smoothing: antialiased;
    text-shadow: none;
  }
  .home-dots {
    width: min(250px, 50vw);
    height: 30px;
    margin-top: 8px;
    margin-left: 3px;
    display: block;
    overflow: visible;
  }
  .home-dots .trail-dot { fill: #151515; }
  .home-dots .trail-dot.soft { fill: #737373; }
  .home-dots .trail-star { stroke: #151515; stroke-width: 2.1; stroke-linecap: round; }

  .home-sections {
    position: absolute;
    top: clamp(190px, 31vh, 270px);
    left: clamp(28px, 14vw, 220px);
    display: flex;
    align-items: flex-start;
    gap: clamp(16px, 2vw, 28px);
    flex-wrap: wrap;
    max-width: min(880px, calc(100vw - 56px));
  }
  .home-card {
    width: min(190px, calc((100vw - 88px) / 3));
    min-width: 150px;
    border: 0;
    background: transparent;
    padding: 0;
    cursor: pointer;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .home-card-visual {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 28px;
    border: 1px solid rgba(0,0,0,.06);
    background: linear-gradient(180deg, #fcfcfc 0%, #f3f3f3 100%);
    box-shadow: 0 16px 32px rgba(0,0,0,.05), inset 0 1px 0 rgba(255,255,255,.92);
    display: grid;
    place-items: center;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .home-card:hover .home-card-visual {
    transform: translateY(-4px);
    box-shadow: 0 20px 36px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.94);
  }
  .home-card:focus-visible {
    outline: 3px solid #111;
    outline-offset: 6px;
    border-radius: 28px;
  }
  .home-card-label {
    font-family: "Avenir Next", "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
    font-size: clamp(20px, 2.2vw, 25px);
    font-weight: 800;
    color: #111;
    letter-spacing: -0.025em;
  }
  .icon-badge {
    width: 122px;
    height: 122px;
    border-radius: 28px;
    display: grid;
    place-items: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.85);
  }
  .icon-badge svg { width: 72px; height: 72px; }
  .art-badge {
    background: radial-gradient(circle at 30% 28%, #ffd98a, transparent 30%), linear-gradient(135deg, #ffc06a 0%, #ff7aa2 48%, #8e8bff 100%);
  }
  .music-badge {
    background: radial-gradient(circle at 70% 22%, #b4f6ff, transparent 32%), linear-gradient(135deg, #78d9ff 0%, #5db9ff 42%, #6c7cff 100%);
  }
  .videos-badge {
    background: radial-gradient(circle at 28% 24%, #ffe7aa, transparent 28%), linear-gradient(135deg, #ffd465 0%, #ff9a3d 44%, #ff6868 100%);
  }
  @media (max-width: 480px) {
    .home-heading h1 { font-size: clamp(56px, 13vw, 78px); letter-spacing: -0.025em; }
    .home-dots { width: min(210px, 58vw); margin-top: 4px; }
    .home-sections {
      top: 180px;
      left: 24px;
      right: 24px;
      max-width: none;
      gap: 16px;
    }
    .home-card { width: calc(50vw - 32px); min-width: 132px; }
    .home-card-visual { border-radius: 24px; }
    .icon-badge { width: 102px; height: 102px; border-radius: 24px; }
    .icon-badge svg { width: 60px; height: 60px; }
    .home-card-label { font-size: 19px; }
  }
  body.signed-in .blank-page { display: block; }
  body.signed-in #dots, body.signed-in .stage { display: none; }
  .password-message { margin: -4px 0 0; min-height: 0; font: 700 12px/1.4 Arial, sans-serif; color: #c32222; }
  .password-field input.invalid, .password-field input.invalid:focus {
    border: 2px solid #df2b2b;
    box-shadow: 0 0 0 3px rgba(223,43,43,.10);
  }
  .password-field input.generated { border-color: #e99a32; }

  .username-message {
    min-height: 0;
    color: #505050;
    font: 12px/1.4 Arial, Helvetica, sans-serif;
    margin: 0;
  }
  .username-message.error { color: #c32222; margin-top: 2px; font-weight: 700; }
  .username-field input.invalid,
  .username-field input.invalid:focus {
    border: 2px solid #df2b2b;
    box-shadow: 0 0 0 3px rgba(223,43,43,.10);
  }
  @media (max-width: 480px) {
    .stage { padding: 24px; }
    .panel {
      width: min(350px, calc(100vw - 48px));
      height: min(550px, calc(100dvh - 48px));
      border-radius: 28px;
    }
  }
</style>
</head>
<body>
<canvas id="dots" aria-hidden="true"></canvas>
<main class="stage">
  <section class="panel" id="panel" aria-label="Sign in">
    <form id="auth-form" style="display:contents" autocomplete="on">
    <div class="panel-title" id="auth-title">Sign In</div>
    <svg class="title-underline" viewBox="0 0 124 17" aria-hidden="true">
      <path d="M 3 10 C 24 1, 44 16, 63 9 S 101 2, 121 9" fill="none" stroke="#141414" stroke-width="3.5" stroke-linecap="round" />
    </svg>
    <div class="username-field">
      <label for="username">
        <svg class="person-icon" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="7.5" r="4" />
          <path d="M 4.5 21 v-2.1 a7.5 7.5 0 0 1 15 0 V21" />
        </svg>
        Username:
      </label>
      <input id="username" type="text" name="username" placeholder="type..." maxlength="15" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="username-message" />

    </div>
    <div class="password-field">
      <label for="password">
        <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4.5" y="10.5" width="15" height="11" rx="2.5" />
          <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5" />
        </svg>
        Password:
      </label>
      <input id="password" type="password" name="password" placeholder="type..." autocomplete="current-password" aria-label="Password" aria-describedby="password-message" />
      <label class="show-password-row" for="show-password"><input id="show-password" type="checkbox"> Show password</label>
      <button type="button" class="generate-password" id="generate-password" aria-label="Create strong password">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 19 11-11"/><path d="m14.5 5.5 4 4"/><path d="M19 2v3m-1.5-1.5h3M6 3v3M4.5 4.5h3M21 12v3m-1.5-1.5h3"/></svg>

      </button>
      <p class="password-message" id="password-message" aria-live="polite"></p>
    </div>
    <p class="notice" id="auth-message" aria-live="polite"></p>
    <button type="submit" class="primary-action" id="primary-action">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M14.5 4H19a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4.5"/></svg>
      <span id="primary-label">Sign In</span>
    </button>
    <button type="button" id="switch-mode" class="auth-switch">Create Account</button>
    </form>
  </section>
</main>
<div class="blank-page" id="blank-page" aria-label="Home page">
  <header class="home-heading">
    <h1>Home</h1>
    <svg class="home-dots" viewBox="0 0 265 34" aria-hidden="true">
      <circle class="trail-dot" cx="8" cy="19" r="5"/>
      <circle class="trail-dot" cx="25" cy="18" r="4"/>
      <circle class="trail-dot" cx="41" cy="16" r="3.3"/>
      <circle class="trail-dot soft" cx="55" cy="14" r="2.6"/>
      <circle class="trail-dot" cx="68" cy="13" r="4.1"/>
      <circle class="trail-dot" cx="85" cy="12" r="3.2"/>
      <circle class="trail-dot" cx="100" cy="13" r="4.8"/>
      <circle class="trail-dot soft" cx="118" cy="16" r="2.7"/>
      <circle class="trail-dot" cx="132" cy="18" r="4"/>
      <circle class="trail-dot" cx="149" cy="19" r="3.3"/>
      <circle class="trail-dot" cx="166" cy="20" r="4.7"/>
      <circle class="trail-dot soft" cx="184" cy="19" r="2.8"/>
      <circle class="trail-dot" cx="199" cy="17" r="3.8"/>
      <circle class="trail-dot" cx="216" cy="14" r="3"/>
      <circle class="trail-dot" cx="231" cy="11" r="4.4"/>
      <path class="trail-star" d="M250 4v13M243.5 10.5h13M245.5 5.7l9 9.6M254.5 5.7l-9 9.6"/>
      <circle class="trail-dot soft" cx="257" cy="27" r="2"/>
    </svg>
  </header>
  <section class="home-sections" aria-label="Home buttons">
    <button class="home-card" type="button" aria-label="Art">
      <span class="home-card-visual">
        <span class="icon-badge art-badge" aria-hidden="true">
          <svg viewBox="0 0 80 80" fill="none">
            <path d="M41 11c-15.8 0-28.5 10.8-28.5 25.4 0 9.2 6.2 16.9 16.1 16.9h3.7c3.4 0 5.1 3.8 2.8 6.3-2.2 2.4-1.5 6.7 3.9 8.4 14.6 4.4 37-8.8 37-29C76 24.1 60.4 11 41 11Z" fill="rgba(255,255,255,.94)"/>

  <div class="save-dialog">
    <div class="save-actions">
      <button type="button" class="save-action remember-action" id="remember-name">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17l9-10"/><path d="M12 3.5a8.5 8.5 0 1 1-8.5 8.5"/></svg>

<script>
(() => {
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const usernameMessage = document.getElementById('username-message');
  const passwordMessage = document.getElementById('password-message');
  const authMessage = document.getElementById('auth-message');
  const authForm = document.getElementById('auth-form');
  const switchButton = document.getElementById('switch-mode');
  const primaryLabel = document.getElementById('primary-label');
  const authTitle = document.getElementById('auth-title');
  const generateButton = document.getElementById('generate-password');
  const overlay = document.getElementById('save-overlay');
  const blockedWords = ['fuck', 'shit', 'bitch', 'cunt', 'nigger', 'faggot', 'dick', 'pussy', 'asshole'];
  const rememberKey = 'prudently_remember_30_days_v1';
  const rememberLength = 30 * 24 * 60 * 60 * 1000;
  const showPassword = document.getElementById('show-password');
  let mode = 'signin';
  let newUsername = '';
  const store = {
    get(key) { try { return localStorage.getItem(key); } catch (_) { return null; } },
    set(key,value) { try { localStorage.setItem(key,value); return true; } catch (_) { return false; } },
    remove(key) { try { localStorage.removeItem(key); } catch (_) {} }
  };
  function cleanUsername(value) {
    let dashes = 0, digits = 0, underscores = 0;
    let result = '';
    for (const char of value) {
      if (!/[a-zA-Z0-9_-]/.test(char) || result.length >= 15) continue;
      if (char === '-' && ++dashes > 2) continue;
      if (char === '_' && ++underscores > 3) continue;
      if (/[0-9]/.test(char) && ++digits > 5) continue;
      result += char;
    }
    return result;
  }
  const inappropriate = (value) => blockedWords.some(w => value.toLowerCase().replace(/[^a-z]/g,'').includes(w));
  function showFieldError(input, msg, error) {
    input.classList.toggle('invalid', Boolean(error));
    input.setAttribute('aria-invalid', String(Boolean(error)));
    msg.textContent = error ? 'Error' : '';
    msg.classList.toggle('error',Boolean(error));
  }
  usernameInput.addEventListener('input', () => {
    usernameInput.value = cleanUsername(usernameInput.value);
    showFieldError(usernameInput, usernameMessage, inappropriate(usernameInput.value));
    authMessage.textContent = '';
  });
  showPassword.addEventListener('change', () => {
    passwordInput.type = showPassword.checked ? 'text' : 'password';
  });
  passwordInput.addEventListener('input', () => {
    passwordInput.classList.remove('generated');
    passwordInput.type = showPassword.checked ? 'text' : 'password';
    showFieldError(passwordInput, passwordMessage, inappropriate(passwordInput.value) || (mode === 'create' && passwordInput.value.length > 0 && passwordInput.value.length < 6));
    authMessage.textContent = '';
  });
  function randomIndex(length) {
    const limit = Math.floor(256 / length) * length;
    const bytes = new Uint8Array(1);
    do { crypto.getRandomValues(bytes); } while (bytes[0] >= limit);
    return bytes[0] % length;
  }
  const sets = ['ABCDEFGHJKLMNPQRSTUVWXYZ','abcdefghijkmnopqrstuvwxyz','23456789','!@#$%&*?'];
  generateButton.addEventListener('click', () => {
    if (!crypto.getRandomValues) { authMessage.textContent = 'Secure password generation unavailable.'; return; }
    const all = sets.join('');
    let value;
    do {
      const chars = sets.map(set => set[randomIndex(set.length)]);
      while (chars.length < 20) chars.push(all[randomIndex(all.length)]);
      for (let i = chars.length-1; i > 0; i--) { const j = randomIndex(i+1); [chars[i],chars[j]] = [chars[j],chars[i]]; }
      value = chars.join('');
    } while (inappropriate(value));
    passwordInput.value = value;
    passwordInput.type = 'text';
    showPassword.checked = true;
    passwordInput.classList.add('generated');
    showFieldError(passwordInput,passwordMessage,false);
    passwordInput.focus(); passwordInput.select();
    authMessage.textContent = '';
  });
  function setMode(next) {
    mode = next;
    const create = next === 'create';
    authTitle.textContent = create ? 'Create Account' : 'Sign In';
    document.getElementById('panel').setAttribute('aria-label',create?'Create account':'Sign in');
    primaryLabel.textContent = create ? 'Create' : 'Sign In';
    switchButton.textContent = create ? 'Back to Sign In' : 'Create Account';
    passwordInput.autocomplete = create ? 'new-password' : 'current-password';
    generateButton.style.display = create ? '' : 'none';
    passwordInput.value = '';
    showPassword.checked = false;
    passwordInput.type = 'password';
    passwordInput.classList.remove('generated');
    showFieldError(passwordInput,passwordMessage,false);
    showFieldError(usernameInput,usernameMessage,false);
    authMessage.textContent = '';
  }
  switchButton.addEventListener('click', () => setMode(mode === 'create' ? 'signin' : 'create'));
  // Local preview: an HTML file has no running account server.
  // Store only salted password verifiers, never the actual passwords.
  // This is a single-browser demo, not production authentication.
  const localAccountsKey = 'prudently_local_accounts_v1';
  const localSessionKey = 'prudently_local_session_v2';
  const sessionLength = 30 * 24 * 60 * 60 * 1000;
  // Forget any older sessions that did not have an expiration date.
  store.remove('prudently_local_session_v1');
  async function passwordVerifier(password, salt) {
    const data = new TextEncoder().encode(salt + ':' + password);
    if (globalThis.crypto && crypto.subtle) {
      const bytes = new Uint8Array(await crypto.subtle.digest('SHA-256', data));
      return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
    }
    // Demo-only fallback for browsers that restrict Web Crypto on local previews.
    let a = 2166136261, b = 2246822519;
    for (const byte of data) {
      a = Math.imul(a ^ byte, 16777619) >>> 0;
      b = Math.imul(b ^ byte, 3266489917) >>> 0;
    }
    return a.toString(16).padStart(8, '0') + b.toString(16).padStart(8, '0');
  }
  async function localApi(path, payload) {
    let accounts;
    try { accounts = JSON.parse(store.get(localAccountsKey) || '{}'); }
    catch (_) { accounts = {}; }
    const username = payload.username.trim();
    const key = username.toLowerCase();
    if (path === '/api/register') {
      if (accounts[key]) throw new Error('That username is already taken.');
      const random = new Uint8Array(16);
      crypto.getRandomValues(random);
      const salt = Array.from(random, b => b.toString(16).padStart(2, '0')).join('');
      const verifier = await passwordVerifier(payload.password, salt);
      accounts[key] = { username, salt, verifier };
      if (!store.set(localAccountsKey, JSON.stringify(accounts)))
        throw new Error('Your browser did not allow saving the account.');
      return { ok: true };
    }
    if (path === '/api/login') {
      const account = accounts[key];
      if (!account || (await passwordVerifier(payload.password, account.salt)) !== account.verifier)
        throw new Error('Incorrect username or password.');
      if (!store.set(localSessionKey, JSON.stringify({ username, expiresAt: Date.now() + sessionLength })))
        throw new Error('Your browser could not save the sign-in session.');
      return { ok: true };
    }
    throw new Error('Unknown action.');
  }
  async function api(path, payload) {
    return localApi(path, payload);
  }
  authForm.addEventListener('submit',async (event) => {
    event.preventDefault();
    authMessage.textContent = '';
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    if (!username || inappropriate(username)) {
      showFieldError(usernameInput,usernameMessage,true); usernameInput.focus(); return;
    }
    if (!password || inappropriate(password) || (mode === 'create' && password.length < 6)) {
      showFieldError(passwordInput,passwordMessage,true); passwordInput.focus(); return;
    }
    try {
      if (mode === 'create') {
        await api('/api/register',{username,password});
        newUsername = username;
        overlay.classList.add('visible');
      } else {
        await api('/api/login',{username,password});
        document.body.classList.add('signed-in');
        document.title = 'Prudently';
      }
    } catch (err) { authMessage.textContent = err.message || 'Unable to continue in this browser.'; }
  });
  function finishCreate(remember) {
    if (remember) {
      store.set('prudently_saved_username',newUsername);
      store.set(rememberKey, JSON.stringify({username:newUsername, expiresAt:Date.now() + rememberLength}));
    } else {
      store.remove('prudently_saved_username');
      store.remove(rememberKey);
    }
    overlay.classList.remove('visible');
    setMode('signin');
    usernameInput.value = remember ? newUsername : '';
    authMessage.textContent = '';
    if (remember) usernameInput.focus(); else usernameInput.focus();
  }
  document.getElementById('remember-name').addEventListener('click',() => finishCreate(true));
  document.getElementById('skip-name').addEventListener('click',() => finishCreate(false));
  function restoreSession() {
    const raw = store.get(localSessionKey);
    if (!raw) return;
    try {
      const session = JSON.parse(raw);
      if (session && typeof session.username === 'string' &&
          Number.isFinite(session.expiresAt) && session.expiresAt > Date.now()) {
        // Require the stored account to still exist before restoring the session.
        const accounts = JSON.parse(store.get(localAccountsKey) || '{}');
        if (accounts[session.username.toLowerCase()]) {
          document.body.classList.add('signed-in');
          return;
        }
      }
    } catch (_) {}
    store.remove(localSessionKey);
  }
  function restoreUsername() {
    const raw = store.get(rememberKey);
    if (!raw) return;
    try {
      const record = JSON.parse(raw);
      if (record.expiresAt > Date.now() && record.username) {
        usernameInput.value = record.username;
      } else {
        store.remove(rememberKey);
        store.remove('prudently_saved_username');
      }
    } catch (_) { store.remove(rememberKey); }
  }
  setMode('signin');
  restoreUsername();
  restoreSession();
  // Accounts are local to this browser and origin; no server is required.

  const canvas = document.getElementById('dots');
  const panel = document.getElementById('panel');
  const ctx = canvas.getContext('2d', { alpha: false });

  const spacing = 18;
  const baseRadius = 2.1;
  const maxRadius = 8.4;
  const influence = 115;
  const gap = 18;

  let dots = [];
  let width = 0;
  let height = 0;
  let exclusion = null;
  const pointer = { x: -10000, y: -10000 };

  function updateExclusion() {
    const rect = panel.getBoundingClientRect();
    exclusion = {
      left: rect.left - gap,
      top: rect.top - gap,
      right: rect.right + gap,
      bottom: rect.bottom + gap,
    };
  }

  function buildDots() {
    dots = [];
    for (let y = spacing / 2; y < height; y += spacing) {
      for (let x = spacing / 2; x < width; x += spacing) {
        const insideExclusion = exclusion &&
          x > exclusion.left &&
          x < exclusion.right &&
          y > exclusion.top &&
          y < exclusion.bottom;

        if (!insideExclusion) {
          dots.push({ x, y, radius: baseRadius });
        }
      }
    }
  }

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    updateExclusion();
    buildDots();
  }

  function draw() {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = '#111111';

    for (const dot of dots) {
      const distance = Math.hypot(dot.x - pointer.x, dot.y - pointer.y);
      const proximity = Math.max(0, 1 - distance / influence);
      const target = baseRadius + (maxRadius - baseRadius) * proximity * proximity;
      dot.radius += (target - dot.radius) * 0.2;
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('pointermove', (e) => {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
  });

  window.addEventListener('pointerout', (e) => {
    if (!e.relatedTarget) {
      pointer.x = -10000;
      pointer.y = -10000;
    }
  });

  window.addEventListener('blur', () => {
    pointer.x = -10000;
    pointer.y = -10000;
  });

  window.addEventListener('resize', resize);

  resize();
  draw();
})();
</script>
</body>
</html>
